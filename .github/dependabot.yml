version: 2
updates:
  # Keep GitHub Actions pinned to current SHA digests
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Bundle all action bumps into one PR. codeql-action's init/analyze steps
    # must move in lockstep (analyze rejects a config written by a different
    # init version); ungrouped, Dependabot split them into two PRs that each
    # failed with a version mismatch. Grouping keeps coupled actions together.
    groups:
      github-actions:
        patterns:
          - "*"

  # npm: published provenance primitive
  - package-ecosystem: "npm"
    directory: "/primitives/js"
    schedule:
      interval: "weekly"
    # vitest and @vitest/coverage-v8 pin each other exactly (coverage-v8's
    # peer is `vitest@<same version>`); ungrouped, Dependabot split the 4->5
    # major into one PR per package and every PR failed `npm ci` with
    # ERESOLVE (#346, #349, #350, #352). Same shape as the codeql-action
    # precedent above: coupled packages move together.
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"

  # npm: JS enforcement adapters (private, dev-only)
  - package-ecosystem: "npm"
    directory: "/adapters/js"
    schedule:
      interval: "weekly"
    # vitest and @vitest/coverage-v8 pin each other exactly (coverage-v8's
    # peer is `vitest@<same version>`); ungrouped, Dependabot split the 4->5
    # major into one PR per package and every PR failed `npm ci` with
    # ERESOLVE (#346, #349, #350, #352). Same shape as the codeql-action
    # precedent above: coupled packages move together.
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"

  # pip: pinned test/release dependencies. requirements-test.txt is a uv-compiled
  # hashed lock; recompile after a bump per the requirements-test.in header. With
  # the Python floor at 3.11 (SUPPORT.md) the lock is a single flat resolution, so
  # a routine bump no longer needs a universal split or a manual reconcile.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # numpy >=2.5 requires Python >=3.12; our floor is 3.11 (SUPPORT.md), and
    # 3.11 is not EOL until 2027-10 — so this is a dependency running ahead of
    # the EOL calendar, exactly the case the support policy says to hold on.
    # The lock is compiled with `uv pip compile --python-version 3.11`, which
    # correctly refuses 2.5; Dependabot does not read that flag, so it proposed
    # numpy==2.5.1 (#187) and the Python 3.11 CI job failed at install with
    # "No matching distribution found". Ungated, that PR regenerates weekly.
    # Remove this entry when the floor moves to 3.12.
    ignore:
      - dependency-name: "numpy"
        versions: [">=2.5"]
