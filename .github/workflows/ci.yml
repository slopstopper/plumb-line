name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: Manifest versions agree
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 — the constraints drift gate reads blocks at the sha each
      # downstream copy pins; pinned-sha reads fail on a shallow clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: "20"
      - name: The 3 release manifests must report the same version
        run: node scripts/check-versions.mjs
      - name: The plugin-bundled primitive must not drift from primitives/
        run: node scripts/check-bundle-sync.mjs
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      # Runs on every PR, not just releases: stale wire-version prose arrives
      # via ordinary doc edits, not only via a bump. Pure stdlib, so it needs no
      # test deps. Shells out to node for the badge diff — this job has node.
      - name: Live docs must not state a stale envelope wire version
        run: python3 scripts/check_version_prose.py
      # Checks copies of the docs/constraints.md block against this file at the
      # sha each copy pins. Sha-pinning keeps merged docs green as constraints
      # evolve; a stale-but-consistent pin passes here and surfaces in the
      # digest instead. Needs the full history fetched above.
      - name: Copied constraint blocks must match docs/constraints.md
        run: bash scripts/check-constraints-drift.sh

  javascript:
    name: JavaScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: ${{ matrix.node }}
      - name: primitives/js — provenance primitive
        working-directory: primitives/js
        run: npm ci && npm test
      - name: adapters/js — enforcement adapters
        working-directory: adapters/js
        run: npm ci && npm test
      - name: conformance report (envelope schema)
        run: node primitives/conformance/report.mjs
      - name: conformance against the plugin-bundled copy
        run: node scripts/check-bundle-conformance.mjs

  lint:
    name: Lint (ESLint + Ruff)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: "20"
      - name: ESLint — primitives/js
        working-directory: primitives/js
        run: npm ci && npm run lint
      - name: ESLint — adapters/js
        working-directory: adapters/js
        run: npm ci && npm run lint
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: install lint deps (hash-pinned)
        # --require-hashes: ruff (and all deps) must match a hash in the lock.
        run: pip install --require-hashes -r requirements-test.txt
      - name: Ruff — Python source
        run: ruff check .

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: adapters — guarded imports work with NO extras installed
        run: python scripts/check_adapter_guarded_imports.py
      - name: install test deps
        # --require-hashes: every dep (incl. transitive) must match a hash in
        # the lock, so a compromised index cannot swap in a tampered wheel.
        run: pip install --require-hashes -r requirements-test.txt
      - name: primitives/python — provenance primitive
        working-directory: primitives/python
        run: python -m pytest -q
      - name: adapters/python — enforcement adapters
        working-directory: adapters/python
        run: python -m pytest -q
      - name: examples — fixtures + real import-linter boundary
        run: python -m pytest -q examples
      - name: conformance against the plugin-bundled Python copy
        run: python -m pytest -q scripts/test_bundle_conformance.py
      # The repo-infrastructure checkers (wire-version prose #160, report-format
      # #139). Named explicitly because every other pytest step above is scoped
      # to a package directory, so scripts/ was never collected — both suites
      # could have regressed silently.
      - name: repo-infrastructure checkers (scripts/)
        run: python -m pytest -q scripts/test_version_prose.py scripts/test_report_format.py scripts/test_fit_map_snippets.py
