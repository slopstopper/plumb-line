name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: Manifest versions agree
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 — the constraints drift gate reads blocks at the sha each
      # downstream copy pins; pinned-sha reads fail on a shallow clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: "22"
      - name: The 3 release manifests must report the same version
        run: node scripts/check-versions.mjs
      - name: The plugin-bundled primitive must not drift from primitives/
        run: node scripts/check-bundle-sync.mjs
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      # Runs on every PR, not just releases: stale wire-version prose arrives
      # via ordinary doc edits, not only via a bump. Pure stdlib, so it needs no
      # test deps. Shells out to node for the badge diff — this job has node.
      - name: Live docs must not state a stale envelope wire version
        run: python3 scripts/check_version_prose.py
      # Checks copies of the docs/constraints.md block against this file at the
      # sha each copy pins. Sha-pinning keeps merged docs green as constraints
      # evolve; a stale-but-consistent pin passes here and surfaces in the
      # digest instead. Needs the full history fetched above. Ends every run
      # with "N copies checked, M drifted" (#249) — read that line, not the
      # exit code alone, when judging what the gate proved.
      - name: Copied constraint blocks must match docs/constraints.md
        run: bash scripts/check-constraints-drift.sh
      # The other direction (#248): the canonical file itself must state what
      # the manifests, provenance source, pyproject and this workflow's
      # matrices actually hold — otherwise every sha-pinned copy inherits a
      # false claim. Prints the checked count and names what it cannot check.
      - name: docs/constraints.md must match the sources it describes
        run: python3 scripts/check_constraints_canonical.py

  javascript:
    name: JavaScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: ${{ matrix.node }}
      - name: primitives/js — provenance primitive
        working-directory: primitives/js
        run: npm ci && npm test
      - name: adapters/js — enforcement adapters
        working-directory: adapters/js
        run: npm ci && npm test
      - name: conformance report (envelope schema)
        run: node primitives/conformance/report.mjs
      - name: conformance against the plugin-bundled copy
        run: node scripts/check-bundle-conformance.mjs
      - name: baseline example validates
        run: node primitives/js/baseline-cli.mjs validate --dir examples/baseline/baselines

  lint:
    name: Lint (ESLint + Ruff)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: "22"
      - name: ESLint — primitives/js
        working-directory: primitives/js
        run: npm ci && npm run lint
      - name: ESLint — adapters/js
        working-directory: adapters/js
        run: npm ci && npm run lint
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: install lint deps (hash-pinned)
        # --require-hashes: ruff (and all deps) must match a hash in the lock.
        run: pip install --require-hashes -r requirements-test.txt
      - name: Ruff — Python source
        run: ruff check .

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: adapters — guarded imports work with NO extras installed
        run: python scripts/check_adapter_guarded_imports.py
      - name: install test deps
        # --require-hashes: every dep (incl. transitive) must match a hash in
        # the lock, so a compromised index cannot swap in a tampered wheel.
        run: pip install --require-hashes -r requirements-test.txt
      - name: primitives/python — provenance primitive
        working-directory: primitives/python
        run: python -m pytest -q
      - name: adapters/python — enforcement adapters
        working-directory: adapters/python
        run: python -m pytest -q
      - name: adapters/sarif — SARIF assembler
        run: python -m pytest -q adapters/sarif
      - name: examples — fixtures + real import-linter boundary
        run: python -m pytest -q examples
      - name: conformance against the plugin-bundled Python copy
        run: python -m pytest -q scripts/test_bundle_conformance.py
      # scripts/test_bundle_sync.py runs the bundle gate, which is a Node
      # script — this job has no node without it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: "22"
      # The repo-infrastructure checkers (wire-version prose #160, report-format
      # #139). Named explicitly because every other pytest step above is scoped
      # to a package directory, so scripts/ was never collected — both suites
      # could have regressed silently.
      - name: repo-infrastructure checkers (scripts/)
        run: python -m pytest -q scripts/test_version_prose.py scripts/test_report_format.py scripts/test_fit_map_snippets.py scripts/test_content_language.py scripts/test_trigger_check.py scripts/test_constraints_canonical.py scripts/test_constraints_drift.py scripts/test_bundle_sync.py scripts/test_baseline_roundtrip.py scripts/test_enforcement_manifest.py

  action:
    name: Action (uses ./ against the fixtures)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        fixture: [js-payments-service, python-data-pipeline]
        tree: [broken, clean]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: consumer toolchain (what a real consumer's workflow provides)
        working-directory: examples/${{ matrix.fixture }}/${{ matrix.tree }}
        run: |
          if [ -f package.json ]; then npm ci --no-audit --no-fund; fi
          if [ -f .importlinter ]; then pip install --require-hashes -r "$GITHUB_WORKSPACE/requirements-test.txt"; fi
      # `uses: ./` is the self-reference mode (spec §3): the working tree IS the action.
      # fail-on: none on the broken tree so the job stays green while proving findings
      # were produced; the assertion step below is the real gate.
      - name: run the action
        id: pl
        uses: ./
        with:
          root: examples/${{ matrix.fixture }}/${{ matrix.tree }}
          manifest: .plumb-line/enforcement.json
          fail-on: ${{ matrix.tree == 'broken' && 'none' || 'findings' }}
          upload: "false"
      - name: assert the expected outcome
        env:
          SUMMARY: ${{ steps.pl.outputs.summary-file }}
          TREE: ${{ matrix.tree }}
        run: |
          python3 - "$SUMMARY" "$TREE" <<'EOF'
          import json, os, sys
          s = json.load(open(sys.argv[1])); tree = sys.argv[2]
          states = {k: v["state"] for k, v in s["capabilities"].items()}
          assert states, "no capabilities ran — the manifest enforces nothing"
          assert all(v == "ran" for v in states.values()), states
          assert os.path.isabs(s["sarif"]) and os.path.isfile(s["sarif"]), s["sarif"]
          if tree == "broken":
              assert s["findings"] >= 1, s
          else:
              assert s["findings"] == 0, s
          print("ok:", states, "findings", s["findings"])
          EOF
