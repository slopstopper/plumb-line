# Release-to-content routine (GH #255): when a release publishes, open an
# issue reminding that one content draft is due, carrying the gates. The
# drafting itself happens in-session (Claude drafts, the owner reviews, edits
# and approves); this workflow only makes the moment un-missable. Event-driven
# by design — no schedule, no draft generation here.
name: release-content

on:
  release:
    types: [published]

permissions:
  contents: read
  issues: write

jobs:
  open-draft-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Open the content-draft-due issue
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          URL: ${{ github.event.release.html_url }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Content draft due: $TAG" \
            --label "track:distribution" \
            --body "$(printf 'Release %s published: %s\n\nOne short piece is due, drafted from what actually shipped. Template and the four gates: docs/content/TEMPLATE.md. Drafts only; the owner approves everything outbound. Close this issue when the piece merges to docs/content/ (or with a written decision to skip this release).\n\nOpened automatically by .github/workflows/release-content.yml (GH #255).' "$TAG" "$URL")"
