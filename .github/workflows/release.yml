name: Release

# Fires when you push a version tag (e.g. v0.3.0). Three jobs, in order:
#   guard   — the tag matches the manifests and the CHANGELOG has its section;
#   ci      — the WHOLE of ci.yml, called as a reusable workflow, so the
#             release gate is exactly the PR gate (it once was a hand-kept
#             copy, and 0.11.2 shipped past a narrower one);
#   release — publishes the npm + PyPI packages and creates the GitHub
#             release, only if both of the above passed.
#
# The packages publish at whatever version is in the manifests at the tagged
# commit — so tag the commit AFTER the version-bump PR is merged. The guard
# makes a premature or mismatched tag fail instead of publishing the wrong thing.
#
# Auth is OIDC trusted publishing — no stored tokens. One-time, register a
# GitHub Actions trusted publisher for this repo + this workflow on each registry
# (npm: package settings → Trusted Publisher; PyPI: project → Publishing →
# Trusted Publishers).
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  # --- guard: runs first so a mis-tag fails fast, before any test or publish.
  guard:
    name: Guard — tag matches manifests and CHANGELOG
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          node-version: "22"
      - name: Guard — tag matches manifests and CHANGELOG
        run: |
          node scripts/check-versions.mjs "$GITHUB_REF_NAME"
          VER="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[$VER\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VER]' section — promote [Unreleased] before tagging."
            exit 1
          fi
          echo "✓ CHANGELOG has a [$VER] section"

  # --- gate: the whole PR CI, every job, at the tagged commit.
  ci:
    needs: guard
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: [guard, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # mint the OIDC token for trusted publishing
      issues: write     # open the content-draft-due issue (GH #255/#321)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          # Node 24 bundles an npm that meets the trusted-publishing floor, so
          # no npm is fetched from the registry inside this credential-bearing
          # job (it used to install a newer npm globally, unlocked). The floor is
          # asserted below, so a too-old bundle fails loudly, never silently.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Tests are NOT run here: this job needs [guard, ci], and the ci job runs
      # the whole of ci.yml (incl. the primitives/js test suite) on this commit. That
      # is the only pre-publish test gate. primitives/js/.npmrc sets
      # ignore-scripts=true, so npm would skip a prepublishOnly hook anyway;
      # the hook was removed rather than left implying a gate that never runs.
      - name: primitives/js — install
        working-directory: primitives/js
        run: npm ci

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: install build deps
        # --require-hashes: every dep (incl. transitive) must match a hash in
        # the lock, so a compromised index cannot swap in a tampered wheel.
        run: pip install --require-hashes -r requirements-test.txt

      # --- publish npm via OIDC trusted publishing (requires npm >= 11.5.1;
      #     publishes provenance attestations by default) ---
      - name: npm meets the trusted-publishing floor (>= 11.5.1)
        run: |
          v="$(npm --version)"; echo "bundled npm $v"
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$v" \
            || { echo "::error::bundled npm $v is below 11.5.1; trusted publishing would fail"; exit 1; }
      - name: Publish to npm
        working-directory: primitives/js
        run: npm publish --provenance

      # --- publish PyPI via OIDC trusted publishing (no password input) ---
      - name: Build Python package
        working-directory: primitives/python
        # --no-isolation: build with the setuptools already installed from the
        # hashed lock above. Isolated builds fetch the build backend from PyPI,
        # unpinned and unhashed, inside this credential-bearing job.
        run: python -m build --no-isolation
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1
        with:
          packages-dir: primitives/python/dist

      # --- GitHub release with auto-generated notes. A write-up merged with
      #     the release PR is approved (docs/content/TEMPLATE.md), so it goes
      #     above the generated notes, links made absolute at the tag (#480).
      #     Idempotent: if the tag was pushed by publishing a release in the
      #     GitHub UI (the no-terminal route), the release already exists; it
      #     gets the write-up on top if it does not carry it yet. ---
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$RUNNER_TEMP/notes.md"
          python scripts/release_notes.py "${GITHUB_REF_NAME#v}" --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" --out "$NOTES"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists (created in the UI)."
            if [ -s "$NOTES" ] && ! gh release view "$GITHUB_REF_NAME" --json body --jq .body | grep -qF "Canonical copy:"; then
              { cat "$NOTES"; echo; gh release view "$GITHUB_REF_NAME" --json body --jq .body; } > "$RUNNER_TEMP/combined.md"
              gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/combined.md"
              echo "Added the write-up to the top of the existing release."
            fi
          elif [ -s "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" --generate-notes --notes-file "$NOTES" --title "plumb-line $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "plumb-line $GITHUB_REF_NAME"
          fi

      # --- Release-to-content routine (GH #255). Lives HERE, not in a
      #     release-triggered workflow: this job publishes the release under
      #     the default GITHUB_TOKEN, and GitHub suppresses workflow triggers
      #     for events that token creates — an `on: release` workflow can
      #     never fire for a tag-triggered release (found live on v0.10.0,
      #     GH #321). Running as a step after publish gives the correct
      #     ordering for free. Skipped when the write-up shipped with the
      #     release (#480: the create step rendered it); idempotent: skips if
      #     the issue already exists. ---
      - name: Open the content-draft-due issue (GH #255)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Content draft due: $GITHUB_REF_NAME"
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            echo "The write-up shipped with the release (#480) — no draft is due."
          elif gh issue list --repo "$GITHUB_REPOSITORY" --search "in:title \"$TITLE\"" --state all --json number --jq 'length' | grep -qv '^0$'; then
            echo "Draft-due issue already exists for $GITHUB_REF_NAME — leaving it."
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --label "track:distribution" \
              --body "$(printf 'Release %s published.\n\nOne short piece is due, drafted from what actually shipped. Template and the four gates: docs/content/TEMPLATE.md. Drafts only; the owner approves everything outbound. Close this issue when the piece merges to docs/content/ (or with a written decision to skip this release).\n\nOpened automatically by .github/workflows/release.yml (GH #255; moved from release-content.yml, GH #321).' "$GITHUB_REF_NAME")"
          fi

      # --- Site resync ping. slopstopper.org regenerates its version pills
      #     and writing list on a `tool-released` repository_dispatch; this
      #     is speed, not correctness — the site also resyncs daily. Needs
      #     the SITE_DISPATCH_TOKEN secret (fine-grained PAT, contents write
      #     on slopstopper/slopstopper.org). Missing token → skip, never fail. ---
      - name: Ping slopstopper.org to resync
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "SITE_DISPATCH_TOKEN not set; skipping ping"; exit 0; fi
          gh api repos/slopstopper/slopstopper.org/dispatches -f event_type=tool-released
